<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">Reliable LLM Chatbot Backend Architecture</title><desc id="desc">Client requests enter FastAPI, pass observability and routing, then either direct async chat or grounded retrieval, with semaphore and queue boundaries before the downstream LLM. Jobs can be observed through polling, SSE, or WebSocket.</desc><rect width="1280" height="720" fill="#ffffff"/><style>text{font-family:Arial,sans-serif;fill:#111827}.box{fill:#f9fafb;stroke:#374151;stroke-width:2}.sub{fill:#eef2ff;stroke:#4f46e5;stroke-width:2}.data{fill:#f0fdf4;stroke:#15803d;stroke-width:2}.line{stroke:#6b7280;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><text x="55" y="48" font-size="26" font-weight="700">Reliable LLM Chatbot Backend</text><text x="55" y="76" font-size="14">Grounded response quality and backend reliability are measured as separate concerns.</text><rect class="box" x="55" y="125" width="160" height="74" rx="8"/><text x="105" y="156" font-size="17" font-weight="700">Client</text><text x="76" y="181" font-size="13">HTTP / SSE / WS</text><rect class="box" x="290" y="110" width="210" height="105" rx="8"/><text x="347" y="143" font-size="17" font-weight="700">FastAPI</text><text x="319" y="170" font-size="13">Correlation ID</text><text x="319" y="192" font-size="13">Metrics / request timing</text><rect class="sub" x="585" y="95" width="230" height="110" rx="8"/><text x="633" y="130" font-size="17" font-weight="700">Direct Chat Path</text><text x="612" y="158" font-size="13">Async I/O</text><text x="612" y="181" font-size="13">Semaphore + HTTP Pool</text><rect class="sub" x="585" y="265" width="230" height="145" rx="8"/><text x="625" y="300" font-size="17" font-weight="700">Grounded RAG Path</text><text x="612" y="329" font-size="13">BM25 retrieval</text><text x="612" y="352" font-size="13">score threshold</text><text x="612" y="375" font-size="13">no-context guard</text><text x="612" y="398" font-size="13">LLM generation</text><rect class="box" x="900" y="155" width="210" height="100" rx="8"/><text x="958" y="190" font-size="17" font-weight="700">LLM Provider</text><text x="931" y="218" font-size="13">retry / backoff / timeout</text><rect class="data" x="900" y="310" width="210" height="90" rx="8"/><text x="956" y="345" font-size="17" font-weight="700">Knowledge Store</text><text x="938" y="372" font-size="13">documents / retrieval index</text><rect class="box" x="290" y="470" width="210" height="120" rx="8"/><text x="337" y="505" font-size="17" font-weight="700">Bounded Queue</text><text x="327" y="532" font-size="13">Request ID / backpressure</text><text x="327" y="555" font-size="13">Queue wait separated</text><rect class="box" x="585" y="480" width="230" height="105" rx="8"/><text x="658" y="515" font-size="17" font-weight="700">Workers</text><text x="620" y="542" font-size="13">shared concurrency limiter</text><text x="620" y="565" font-size="13">processing time measured</text><rect class="data" x="900" y="485" width="210" height="90" rx="8"/><text x="950" y="520" font-size="17" font-weight="700">State Layer</text><text x="935" y="547" font-size="13">PostgreSQL / Redis boundary</text><line class="line" x1="215" y1="162" x2="290" y2="162"/><line class="line" x1="500" y1="145" x2="585" y2="145"/><line class="line" x1="500" y1="185" x2="585" y2="315"/><line class="line" x1="815" y1="150" x2="900" y2="200"/><line class="line" x1="815" y1="350" x2="900" y2="350"/><line class="line" x1="815" y1="315" x2="900" y2="230"/><line class="line" x1="395" y1="215" x2="395" y2="470"/><line class="line" x1="500" y1="530" x2="585" y2="530"/><line class="line" x1="815" y1="530" x2="900" y2="530"/><line class="line" x1="700" y1="480" x2="700" y2="410"/><text x="55" y="665" font-size="14">Design rule: short requests use the smallest concurrency boundary; long-running work is separated into a bounded queue only when request lifetime and backpressure require it.</text></svg>