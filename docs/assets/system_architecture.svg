<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc"><title id="title">LLM 채팅 백엔드 구조</title><desc id="desc">사용자 요청이 FastAPI로 들어와 일반 대화 또는 문서 기반 대화로 분기되며, 외부 LLM 호출 앞에서 세마포어와 대기열로 동시성과 과부하를 제어합니다.</desc><rect width="1280" height="720" fill="#ffffff"/><style>text{font-family:Arial,'Noto Sans KR',sans-serif;fill:#111827}.box{fill:#f9fafb;stroke:#374151;stroke-width:2}.sub{fill:#eef2ff;stroke:#4f46e5;stroke-width:2}.data{fill:#f0fdf4;stroke:#15803d;stroke-width:2}.line{stroke:#6b7280;stroke-width:2;fill:none;marker-end:url(#arrow)}</style><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6b7280"/></marker></defs><text x="55" y="48" font-size="26" font-weight="700">LLM 채팅 백엔드</text><text x="55" y="76" font-size="14">응답 근거와 백엔드 안정성을 분리해서 측정합니다.</text><rect class="box" x="55" y="125" width="160" height="74" rx="8"/><text x="105" y="156" font-size="17" font-weight="700">사용자</text><text x="76" y="181" font-size="13">HTTP / SSE / WebSocket</text><rect class="box" x="290" y="110" width="210" height="105" rx="8"/><text x="347" y="143" font-size="17" font-weight="700">FastAPI</text><text x="319" y="170" font-size="13">요청 추적 ID</text><text x="319" y="192" font-size="13">요청 지표 / 처리시간</text><rect class="sub" x="585" y="95" width="230" height="110" rx="8"/><text x="633" y="130" font-size="17" font-weight="700">일반 대화</text><text x="612" y="158" font-size="13">비동기 I/O</text><text x="612" y="181" font-size="13">세마포어 + HTTP 연결 풀</text><rect class="sub" x="585" y="265" width="230" height="145" rx="8"/><text x="625" y="300" font-size="17" font-weight="700">문서 기반 RAG</text><text x="612" y="329" font-size="13">BM25 문서 검색</text><text x="612" y="352" font-size="13">검색 점수 기준</text><text x="612" y="375" font-size="13">근거 부족 차단</text><text x="612" y="398" font-size="13">LLM 응답 생성</text><rect class="box" x="900" y="155" width="210" height="100" rx="8"/><text x="958" y="190" font-size="17" font-weight="700">외부 LLM</text><text x="931" y="218" font-size="13">재시도 / 백오프 / 제한시간</text><rect class="data" x="900" y="310" width="210" height="90" rx="8"/><text x="956" y="345" font-size="17" font-weight="700">문서 저장소</text><text x="938" y="372" font-size="13">문서 / 검색 색인</text><rect class="box" x="290" y="470" width="210" height="120" rx="8"/><text x="337" y="505" font-size="17" font-weight="700">제한된 대기열</text><text x="327" y="532" font-size="13">요청 ID / 과부하 제어</text><text x="327" y="555" font-size="13">대기시간 별도 측정</text><rect class="box" x="585" y="480" width="230" height="105" rx="8"/><text x="658" y="515" font-size="17" font-weight="700">작업 처리자</text><text x="620" y="542" font-size="13">공유 동시 호출 제한</text><text x="620" y="565" font-size="13">실제 처리시간 측정</text><rect class="data" x="900" y="485" width="210" height="90" rx="8"/><text x="950" y="520" font-size="17" font-weight="700">상태 저장 계층</text><text x="935" y="547" font-size="13">PostgreSQL / Redis</text><line class="line" x1="215" y1="162" x2="290" y2="162"/><line class="line" x1="500" y1="145" x2="585" y2="145"/><line class="line" x1="500" y1="185" x2="585" y2="315"/><line class="line" x1="815" y1="150" x2="900" y2="200"/><line class="line" x1="815" y1="350" x2="900" y2="350"/><line class="line" x1="815" y1="315" x2="900" y2="230"/><line class="line" x1="395" y1="215" x2="395" y2="470"/><line class="line" x1="500" y1="530" x2="585" y2="530"/><line class="line" x1="815" y1="530" x2="900" y2="530"/><line class="line" x1="700" y1="480" x2="700" y2="410"/><text x="55" y="665" font-size="14">설계 원칙: 짧은 요청은 가장 작은 동시성 제어 수단을 사용하고, 긴 작업만 제한된 대기열로 분리합니다.</text></svg>